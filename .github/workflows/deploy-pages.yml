name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout doc site
        uses: actions/checkout@v4
        with:
          path: evergreen-design-system-doc

      - name: Checkout design-system website (tokens)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/evergreen-design-system-website
          path: evergreen-design-system-website

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            evergreen-design-system-doc/pnpm-lock.yaml
            evergreen-design-system-website/pnpm-lock.yaml

      - name: Install & build tokens (website)
        working-directory: evergreen-design-system-website
        run: |
          pnpm install --frozen-lockfile
          pnpm build:tokens

      - name: Install doc dependencies
        working-directory: evergreen-design-system-doc
        run: pnpm install --frozen-lockfile

      - name: Build doc site
        working-directory: evergreen-design-system-doc
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: evergreen-design-system-doc/dist
          force_orphan: true
