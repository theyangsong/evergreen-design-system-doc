name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evergreen-design-system-doc
    steps:
      - name: Checkout doc site
        uses: actions/checkout@v4
        with:
          path: evergreen-design-system-doc

      - name: Checkout design-system website (tokens)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/evergreen-design-system-website
          path: evergreen-design-system-website

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            evergreen-design-system-doc/pnpm-lock.yaml
            evergreen-design-system-website/pnpm-lock.yaml

      - name: Install & build tokens (website)
        working-directory: evergreen-design-system-website
        run: |
          pnpm install --frozen-lockfile
          pnpm build:tokens

      - name: Install doc dependencies
        run: pnpm install --frozen-lockfile

      - name: Build doc site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: evergreen-design-system-doc/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
